# 无人值守自动发布的开关与阈值。
#
# 由 app/services/automation_config.py 加载，每个 tick **重新读一次**。
# 这一点是刻意的，而且不可退化：重读意味着**改这个文件就是热杀开关**——
# 不用重启后端、不用碰 .env、不用等进程重新加载。紧急情况下，
# "把这行改成 false" 必须是立刻生效的。
#
# 与 agent.yaml / style.yaml 同一条纪律：数字写进配置，不写进代码。
# 但这里的每一行都还有第二条理由——它们全部是**安全阈值**，
# 而安全阈值必须能被人在不看代码的情况下调。

# ---------------------------------------------------------------------------
# 总开关
# ---------------------------------------------------------------------------
#
# false = 定时脚本什么都不做（连 run 都不建）。这是唯一的刹车。
# 调度器也读不到任何"绕过"路径——tick 的第一件事就是看它。
enabled: false

# shadow = 自动判断照常跑、照常记录，但**什么都不发**，人仍然照常审。
# live   = 判断通过就真的走发布。
#
# 默认 shadow 不是保守，是**这个功能唯一有意义的起点**：在没有任何一致性数据
# 之前放开正式模式，等于拿真实账号去试错。转正式的门槛见
# GET /api/admin/auto-publish/status。
mode: shadow

# ---------------------------------------------------------------------------
# 目标：Agent 链路是 goal 驱动的，定时任务必须喂它一个
# ---------------------------------------------------------------------------
#
# 这里不是"题目"，是**目标**——Agent 会自己去找题目、查材料、形成观点。
# 按自动 Run 的累计条数**轮流**取，不用随机：同一份配置跑两次应当得到同样的
# 顺序，否则"昨天为什么写了这个"就没法从配置复现。
goals:
  - "找一个当前中文科技圈值得讨论的 AI 话题，写一条有具体观点的帖子"

# ---------------------------------------------------------------------------
# 额度：两个，不是一个
# ---------------------------------------------------------------------------
#
# max_auto_runs_per_day 管的是**成本与队列**：每个 tick 都会跑一整轮 Agent
# （最多 12 步 LLM + 真实 X 检索）。影子模式下一条都不发，但钱照花——
# 所以这个额度在影子模式下同样必须生效。
max_auto_runs_per_day: 3

# max_publishes_per_day 管的是**对外可见的产出**。计入的是"尝试次数"而不是
# "成功次数"：结果未知（publish_unknown）的那次可能已经发出去了，
# 只数成功会让实际发文量悄悄越过上限。
max_publishes_per_day: 1

# ---------------------------------------------------------------------------
# 判据阈值
# ---------------------------------------------------------------------------

# 交付候选的 Critic 分数下限。低于它不自动放行（但也不拒绝，交给人）。
# 抬这个数 = 更少但更有把握的自动发布。
min_critic_score: 7.0

# ---------------------------------------------------------------------------
# 重复检测的窗口
# ---------------------------------------------------------------------------
#
# 重复发帖的风险来自"最近"，不是"历史上"。把三年前的帖子拉进比对语料
# 只会稀释信号，并让检测在每次 tick 里越算越贵。
recent_window_days: 14

# 上面那个窗口里最多取多少条语料。有界是硬要求：
# 没有它，这个读取会长成账号的整个历史长度。
recent_corpus_limit: 50

# ---------------------------------------------------------------------------
# tick 超时
# ---------------------------------------------------------------------------
#
# 一轮 Agent 要发很多次 LLM 请求，llm_timeout_seconds 只约束**单次**调用，
# 约束不了整轮。这个值是整个 tick 的墙钟上限；超时后台账停在什么状态、
# 由谁收尾，见 app/services/auto_publish.py 的 tick() 说明。
tick_timeout_seconds: 900
