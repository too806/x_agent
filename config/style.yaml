# Phase 5B.2 Style & Structure Intelligence 的阈值。
#
# 工作单第十一节把"阈值写进配置、不要硬编码"写成硬要求。这里集中放两件事：
#   1. corpus —— 一条帖子够不够格进 Style Corpus（工作单第十一、十二节）
#   2. recipe —— 从 Profile 推导 StyleRecipe 时的分档切点（工作单第十九节）
#
# 由 app/style/config.py 加载，纯 Python 判定，不依赖 LLM 自觉。

# ---------------------------------------------------------------------------
# 采样账号：**由人指定**（工作单第七、八、三十节）
# ---------------------------------------------------------------------------
#
# 这张清单是本阶段唯一决定"学谁"的地方。刻意放在配置文件里而不是做一个
# 账号管理界面：工作单第三十节把"账号集合由配置/数据库人工指定，代码只负责
# 采集/分析/统计/提炼"写成硬约束，一个可以在界面上点点就加账号的入口，
# 会让"这批语料到底学了谁"变成一个没人答得上来的问题。
#
# 三条纪律（工作单第七、八、三十二节）：
#   1. **没有**自动发现、没有排行榜、没有"高粉优先"。这里列出的就是全部。
#   2. **高互动 ≠ 适合学习的写法**。互动在筛选里只是挡住零互动灌水，
#      不参与任何质量打分，也不影响账号是否入选。
#   3. 学的是**结构与表达方式**，不是某个人的观点、身份、口头禅或人设。
#      所以这本清单里的任何一个账号名都不会出现在给模型的 prompt 里——
#      recipe 只描述"该写成什么样"（见 app/style/recipe.py）。
#
# category 取值见 app/style/taxonomy.py::ACCOUNT_CATEGORIES。
# enabled: false 表示停采，历史样本与已算出的 Profile 不受影响。
#
# 下面这 9 个是 **2026-09-30 人工核对过**的第一批：每一个都用
# `from:<username>` 只读检索确认过"在这个窗口里确实发过中文科技内容"，
# 而不是从任何榜单上摘下来的。核对方式与被排除的候选见
# `docs/phase-5b2-style-intelligence.md` 的采集一节。
#
# `display_name` 刻意**不在这里写**：由采集时 X 自己返回的
# `includes.users[].name` 回填（见 `scripts/collect_style_corpus.py`）。
# 凭记忆手打一串账号名，会在一个没人会去核对的地方引入事实错误；
# 从来源取值则每一条都能回查。
