services:
  postgres:
    image: postgres:16-alpine
    container_name: xagent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xagent}
      POSTGRES_DB: ${POSTGRES_DB:-xagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xagent} -d ${POSTGRES_DB:-xagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
